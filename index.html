<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>CSG Sports Fest 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky sport tabs + search on top; each view is a single column of day-grouped fixture lists, teams below. */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --sunk:#eceff3; --fg:#141922; --muted:#5a6473; --line:#dde2e8;
  --tt:#d0432a; --carrom:#a86a12; --chess:#3d4466; --cricket:#1c7f47; --volley:#1d63c4; --all:#141922;
  --today:#e8a400; --today-bg:#fff6dc;
  --qr-bg:#ffffff;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --accent:var(--all);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1116; --surface:#171b22; --sunk:#1f242d; --fg:#eef1f5; --muted:#9ba4b3; --line:#2b313b;
  --tt:#ff7a5c; --carrom:#e2a54a; --chess:#a9b1e0; --cricket:#4fc985; --volley:#6aa8ff; --all:#eef1f5;
  --today:#ffc83d; --today-bg:#2c2510; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1116; --surface:#171b22; --sunk:#1f242d; --fg:#eef1f5; --muted:#9ba4b3; --line:#2b313b;
  --tt:#ff7a5c; --carrom:#e2a54a; --chess:#a9b1e0; --cricket:#4fc985; --volley:#6aa8ff; --all:#eef1f5;
  --today:#ffc83d; --today-bg:#2c2510; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.05;text-wrap:balance;margin:0;letter-spacing:.01em}
.tabular{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:12px 8px}
.brand a{text-decoration:none}
.brand h1{font-size:1.5rem;text-transform:uppercase}
.brand h1 span{color:var(--muted);font-weight:600}
.brand small{color:var(--muted);font-size:.85rem;white-space:nowrap}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;text-decoration:none;font-weight:600;font-size:.95rem;padding:7px 13px;border-radius:999px;border:1px solid var(--line);color:var(--fg);background:var(--surface)}
.tab[aria-current="page"]{background:var(--c);border-color:var(--c);color:var(--bg)}
.search{position:relative;padding-bottom:12px}
.search input{width:100%;font:inherit;font-size:1rem;padding:11px 40px 11px 40px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);color:var(--fg)}
.search input:focus{outline:none;border-color:var(--fg);background:var(--surface)}
.search svg{position:absolute;left:12px;top:12px;width:18px;height:18px;color:var(--muted)}
.search button{position:absolute;right:6px;top:5px;border:0;background:none;color:var(--muted);font:inherit;font-size:1.3rem;padding:4px 10px;cursor:pointer}

main{padding-block:20px 48px}
.view{display:grid;gap:28px}

/* Sport hero */
.hero{display:grid;gap:14px}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.hero h2{font-size:clamp(2.3rem,8vw,3.4rem);text-transform:uppercase}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.fact b{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:2px}
.fact a{font-weight:600;color:var(--accent)}
.note{background:var(--sunk);border-radius:12px;padding:12px 14px;color:var(--muted);font-size:.93rem}
.soon{border:2px dashed var(--accent);border-radius:14px;padding:18px;text-align:center}
.soon h3{font-size:1.6rem;text-transform:uppercase;color:var(--accent)}
.soon p{margin:.3em 0 0;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:600;padding:9px 14px;border-radius:10px;background:var(--accent);color:var(--bg)}

/* Section */
.sec{display:grid;gap:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-h h3{font-size:1.55rem;text-transform:uppercase}
.sec-h span{color:var(--muted);font-size:.9rem}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:.88rem;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}

/* Day groups */
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.day.is-today{border-color:var(--today);box-shadow:0 0 0 1px var(--today)}
.day-h{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--sunk);font-weight:700}
.day.is-today .day-h{background:var(--today-bg)}
.day-h .d{font-family:var(--display);font-size:1.25rem;text-transform:uppercase;letter-spacing:.02em}
.day-h .n{margin-left:auto;color:var(--muted);font-weight:500;font-size:.85rem}
.badge{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--today);color:#1b1400}
.done{color:var(--muted);font-weight:600;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase}
.slot{padding:6px 14px;font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line)}
.m{display:grid;grid-template-columns:4.6rem 1fr auto;gap:4px 12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.m .t{font-weight:700;font-variant-numeric:tabular-nums;font-size:.95rem}
.m .t small{display:block;font-weight:500;color:var(--muted);font-size:.78rem}
.m .vs{min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;font-weight:600}
.m .vs i{font-style:normal;color:var(--muted);font-weight:500;font-size:.85rem}
.m .vs .tbd{color:var(--muted);font-weight:500}
.m .meta{text-align:right;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.3}
.m .meta .tag{display:inline-block;font-weight:700;color:var(--accent);border:1px solid currentColor;border-radius:6px;padding:0 5px;margin-bottom:2px}
.m .ref{grid-column:2/4;font-size:.8rem;color:var(--muted)}
.m .res-line b{color:var(--fg)}
mark{background:var(--today-bg);color:inherit;border-radius:3px;padding:0 2px;box-shadow:inset 0 -2px 0 var(--today)}

/* Team grids */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.team{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.team h4{margin:0 0 6px;font-family:var(--display);font-size:1.3rem;text-transform:uppercase;color:var(--accent)}
.team h4 small{font-family:var(--body);font-size:.8rem;color:var(--muted);text-transform:none;font-weight:500;margin-left:6px}
.team ol,.team ul{margin:0;padding-left:1.3em;display:grid;gap:2px}
.team li span{color:var(--muted);font-size:.85rem}
.team .plays{margin-top:6px;font-size:.82rem;color:var(--muted)}
.ct{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0 18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px}
.ct div{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);min-width:0}
.ct div b{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600;width:1.7rem;flex:none}
.ct div em{margin-left:auto;font-style:normal;color:var(--muted);font-size:.85rem}

/* All-sports cards */
.sports{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{--accent:var(--c);display:grid;gap:8px;align-content:start;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:14px;padding:14px 16px}
.card h3{font-size:1.7rem;text-transform:uppercase}
.card .st{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.card p{margin:0;color:var(--muted);font-size:.92rem}
.card .go{font-weight:600;color:var(--c)}
.intro h2{font-size:clamp(2.4rem,9vw,3.8rem);text-transform:uppercase}
.intro p{margin:.4em 0 0;color:var(--muted);max-width:60ch}

/* QR */
.qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.qr{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;display:grid;gap:6px;justify-items:center}
.qr .code{background:var(--qr-bg);border-radius:8px;padding:6px;width:100%;max-width:170px}
.qr .code svg{display:block;width:100%;height:auto}
.qr b{font-family:var(--display);font-size:1.15rem;text-transform:uppercase;color:var(--c)}
.copy{font:inherit;font-size:.82rem;font-weight:600;border:1px solid var(--line);background:var(--sunk);color:var(--fg);border-radius:8px;padding:5px 10px;cursor:pointer}
.mine{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.mine .code{background:var(--qr-bg);border-radius:8px;padding:6px;width:130px}
.mine .code svg{display:block;width:100%;height:auto}
.mine div:last-child{min-width:0;flex:1 1 200px}
.mine p{margin:.2em 0 .6em;color:var(--muted);font-size:.9rem;word-break:break-all}

/* Search results */
.res{display:grid;gap:12px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.person>h4{margin:0;padding:12px 14px 4px;font-family:var(--display);font-size:1.5rem;text-transform:uppercase}
.person .roles{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.role{--accent:var(--c);font-size:.82rem;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--c);color:var(--c)}
.person .m{grid-template-columns:5.6rem 1fr auto}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.foot{color:var(--muted);font-size:.82rem;text-align:center;padding-top:8px}
@media (max-width:480px){
  .m{grid-template-columns:3.9rem 1fr;}
  .m .meta{grid-column:2;text-align:left}
  .m .ref{grid-column:2}
  .person .m{grid-template-columns:4.8rem 1fr}
}
@media (prefers-reduced-motion:no-preference){.tab,.chip,.card{transition:background .15s,border-color .15s,color .15s}}
</style>
</head>

<header class="top">
  <div class="wrap">
    <div class="brand"><a href="#"><h1>CSG Sports Fest <span>2026</span></h1></a><small>23 Nov – 9 Dec</small></div>
    <nav class="tabs" id="tabs" aria-label="Sports"></nav>

      <button id="clear" type="button" aria-label="Clear search" hidden>×</button>
    </div>
  </div>
</header>
<main class="wrap"><div id="app" class="view"></div></main>

  const vs = m.b ? `${side(m.a,q)}<i>vs</i>${side(m.b,q)}` : `<span class="tbd">${esc(m.a)}</span>`;
  const tag = opts.withSport ? sp.name : m.tag;
  const sub = opts.withSport ? `${esc(m.label||"")}${m.id?" · "+esc(m.id):""}` : `${esc(m.id)}${m.board?(/^\d/.test(m.board)?` · Board ${esc(m.board)}`:esc(m.board)):""}`;
  const ref = (m.ref ? `<div class="ref">Referee: ${hl(m.ref,q)}</div>` : "") + (m.result ? `<div class="ref res-line">Result: <b>${esc(m.result)}</b></div>` : "");
  return `<div class="m" style="--accent:var(${sp.c})"><div class="t">${when}</div><div class="vs">${vs}</div><div class="meta">${tag?`<span class="tag">${esc(tag)}</span><br>`:""}${sub}</div>${ref}</div>`;
}
function dayBlocks(list, {slots=false}={}){
  const days = {};
  list.forEach(m => (days[m.date] ||= []).push(m));
  return Object.keys(days).sort().map(d => {
    const ms = days[d];
    const today = d===todayISO, past = d<todayISO;
    let body = "", lastSlot = null;
    ms.forEach(m => {
      if(slots && m.slot!==lastSlot){ body += `<div class="slot">${esc(m.slot)}</div>`; lastSlot = m.slot; }
      body += matchRow(m);
    });
    return `<section class="day${today?" is-today":""}" ${today?'id="today"':""}><div class="day-h"><span class="d">${fmtDay(d)}</span>${today?'<span class="badge">Today</span>':past?'<span class="done">Played</span>':""}<span class="n">${ms.length} ${ms.length===1?"match":"matches"}</span></div>${body}</section>`;
  }).join("");
}
function fact(label, html){ return `<div class="fact"><b>${label}</b>${html}</div>`; }
function mapLink(url, text="Open in Google Maps"){ return `<a href="${url}" target="_blank" rel="noopener">${text} ↗</a>`; }
function qrBlock(id, name){
  const svg = QR[id||"all"];
  if(!svg) return "";
  const url = pageURL(id);
  return `<section class="mine"><div class="code" aria-label="QR code for ${esc(name)}">${svg}</div><div><h3>Share this page</h3><p>${esc(url)}</p><button class="copy" type="button" data-copy="${esc(url)}">Copy link</button></div></section>`;
}

/* ---------- Views ---------- */
let filter = {};
function viewTT(){

  const chips = ["all","MS","WS","MD","WD"].map(k=>`<button class="chip" data-f="tt" data-v="${k}" aria-pressed="${ev===k}">${k==="all"?"All events":TT_EVENTS[k]}</button>`).join("");

  <div class="hero"><div class="eyebrow">League stage · 66 matches</div><h2>Table Tennis</h2>

  <section class="sec"><div class="sec-h"><h3>Fixtures</h3><span>League matches only. Knock-out fixtures to follow.</span></div><div class="chips">${chips}</div>${dayBlocks(list)}</section>
  <section class="sec"><div class="sec-h"><h3>Players &amp; pairs</h3></div><div class="grid">${teams}</div></section>
  ${qrBlock("table-tennis","Table Tennis")}`;
}
function viewCarrom(){

  const list = MATCHES.filter(m=>m.sport==="carrom" && (rd==="all"||m.tag===rd));

  const teams = D.carromTeams.map(t=>`<div><b>${pad(t.no)}</b><span>${esc(t.name)}${t.tbc?' <span style="color:var(--muted)">(name TBC)</span>':""}</span><em>${esc(t.r1)}</em></div>`).join("");

function viewChess(){
  const g = filter.chess || "all";
  const list = MATCHES.filter(m=>m.sport==="chess" && (g==="all"||m.tag==="Grp "+g||(!m.tag)));
  const chips = ["all",...Object.keys(D.chessGroups)].map(k=>`<button class="chip" data-f="chess" data-v="${k}" aria-pressed="${g===k}">${k==="all"?"All groups":"Group "+k}</button>`).join("");
  const groups = Object.entries(D.chessGroups).map(([k,ps])=>`<div class="team"><h4>Group ${k}<small>${ps.length} players</small></h4><ul>${ps.map(p=>`<li>${esc(titleCase(p))}</li>`).join("")}</ul><div class="plays">Plays ${D.chessPlays[k]}</div></div>`).join("");
  return `
  <div class="hero"><div class="eyebrow">League stage · 34 players · 8 groups</div><h2>Chess</h2>
    <div class="facts">${fact("Venue",OFFICE+", 4 boards")}${fact("Dates","23 – 26 Nov 2026")}${fact("Time","4:00 – 6:30 PM")}${fact("Time control","15 min per player")}</div>
    <div class="note">One game per player per day. Win 1, draw ½, loss 0. Top 2 from each group (16 players) go to the knock-out, which will be shared after the league. Ties: head-to-head, then wins, then a 5 min blitz playoff on Thu 26 Nov at 6:00 PM. Both players sign the result sheet and post the result in the WhatsApp group.</div></div>
  <section class="sec"><div class="sec-h"><h3>Fixtures</h3><span>Games start at 4:00, 4:40, 5:20 and 6:00 PM</span></div><div class="chips">${chips}</div>${dayBlocks(list,{slots:true})}</section>
  <section class="sec"><div class="sec-h"><h3>Groups</h3></div><div class="grid">${groups}</div></section>

function fixturesOrSoon(k){
  const list = MATCHES.filter(m=>m.sport===k);
  if(!list.length) return `<div class="soon"><h3>Fixtures coming soon</h3><p>Match dates and times will be posted here once they are ready.</p></div>`;
  return `<section class="sec"><div class="sec-h"><h3>Fixtures</h3><span>${list.length} matches</span></div>${dayBlocks(list)}</section>`;
}
function dateRange(k){
  const ds = MATCHES.filter(m=>m.sport===k).map(m=>m.date).sort();
  if(!ds.length) return "To be announced";
  return ds[0]===ds[ds.length-1] ? fmtDay(ds[0]) : `${fmtDay(ds[0])} – ${fmtDay(ds[ds.length-1])}`;
}
function viewCricket(){
  const teams = D.cricket.map(t=>`<div class="team"><h4>${esc(t.name)}<small>${t.players.length} players</small></h4><ol>${t.players.map(p=>`<li>${esc(p)}</li>`).join("")}</ol></div>`).join("");
  return `
  <div class="hero"><div class="eyebrow">6 teams</div><h2>Cricket</h2>
    <div class="facts">${fact("Venue",`Invictus Sports Arena<br><span style="color:var(--muted);font-size:.9rem">#118 Chikkabanavara, North, Hesarghatta Rd, Chikkabanavara, Karnataka 560090</span><br>${mapLink(CRICKET_MAP)}`)}${fact("Dates",dateRange("cricket"))}</div></div>
  ${fixturesOrSoon("cricket")}
  <section class="sec"><div class="sec-h"><h3>Teams</h3><span>From the player auction</span></div><div class="grid">${teams}</div></section>
  ${qrBlock("cricket","Cricket")}`;
}
function viewVolley(){
  const teams = D.volleyball.map(t=>`<div class="team"><h4>${esc(t.name)}<small>${t.players.length} players</small></h4><ol>${t.players.map(([p,r])=>`<li>${esc(p)}${r?` <span>· ${esc(r)}</span>`:""}</li>`).join("")}</ol></div>`).join("");
  return `
  <div class="hero"><div class="eyebrow">CSG Volleyball League · 6 teams</div><h2>Volleyball</h2>
    <div class="facts">${fact("Venue",`Volleyball ground<br>${mapLink(VOLLEY_MAP)}`)}${fact("Dates",dateRange("volleyball"))}</div></div>
  ${fixturesOrSoon("volleyball")}
  <section class="sec"><div class="sec-h"><h3>Teams</h3><span>Playing position shown where the player listed one</span></div><div class="grid">${teams}</div></section>
  ${qrBlock("volleyball","Volleyball")}`;

function viewAll(){
  const upcoming = MATCHES.filter(m=>m.date>=todayISO).sort(byTime);
  const nextDay = upcoming.length ? upcoming[0].date : null;
  const dayList = nextDay ? upcoming.filter(m=>m.date===nextDay) : [];
  const info = {
    tt:["Fixtures out","23 Nov – 2 Dec · from 5:30 PM",OFFICE,"66 league matches"],
    carrom:["Fixtures out","23 Nov – 9 Dec · 5:00 – 7:00 PM",OFFICE,"40 teams · 46 matches"],
    chess:["Fixtures out","23 – 26 Nov · 4:00 – 6:30 PM",OFFICE,"34 players · 51 games"],
    cricket:(D.cricketFixtures||[]).length?["Fixtures out",dateRange("cricket"),"Invictus Sports Arena, Hesarghatta Rd",`${D.cricket.length} teams · ${D.cricketFixtures.length} matches`]:["Fixtures coming soon","Dates to be announced","Invictus Sports Arena, Hesarghatta Rd",`${D.cricket.length} teams`],
    volleyball:(D.volleyballFixtures||[]).length?["Fixtures out",dateRange("volleyball"),"Volleyball ground",`${D.volleyball.length} teams · ${D.volleyballFixtures.length} matches`]:["Fixtures coming soon","Dates to be announced","Volleyball ground",`${D.volleyball.length} teams`],
  };
  const cards = SPORTS.map(s=>{const i=info[s.key];return `<a class="card" href="#${s.id}" style="--c:var(${s.c})"><span class="st">${i[0]}</span><h3>${s.name}</h3><p>${i[1]}<br>${i[2]}<br>${i[3]}</p><span class="go">View ${info[s.key][0]==="Fixtures out"?"fixtures":"teams & venue"} →</span></a>`}).join("");
  const qrs = [{id:"",name:"All sports",c:"--all"},...SPORTS].map(s=>QR[s.id||"all"]?`<div class="qr" style="--c:var(${s.c})"><div class="code">${QR[s.id||"all"]}</div><b>${s.name}</b><button class="copy" type="button" data-copy="${esc(pageURL(s.id))}">Copy link</button></div>`:"").join("");
  const nextTitle = nextDay===todayISO ? "Today's matches" : nextDay ? `Next match day · ${fmtDay(nextDay)}` : "All matches played";
  const nextBody = dayList.length ? `<section class="day${nextDay===todayISO?" is-today":""}">${dayList.map(m=>matchRow(m,"",{withSport:true})).join("")}</section>` : `<div class="note">No more scheduled matches. Check each sport for results.</div>`;
  return `
  <div class="intro"><h2>Sports Fest 2026</h2><p>Fixtures, teams and venues for every sport. Type your name in the search box above to see all your games and timings.</p></div>
  <div class="sports">${cards}</div>
  <section class="sec" style="--accent:var(--today)"><div class="sec-h"><h3>${nextTitle}</h3><span>${dayList.length} matches across sports</span></div>${nextBody}</section>
  <section class="sec"><div class="sec-h"><h3>Scan to open</h3><span>QR codes for each sport page</span></div>${qrs?`<div class="qrs">${qrs}</div>`:`<div class="note">QR codes will appear here.</div>`}</section>`;
}

/* ---------- Search ---------- */
let PEOPLE = [];
function buildPeople(){ PEOPLE = (() => {
  const P = new Map();
  const add = (name, role) => {
    const k = norm(name); if(!k) return;
    if(!P.has(k)) P.set(k,{name:titleCase(name),roles:[],matches:[]});
    const p = P.get(k); if(!p.roles.some(r=>r.text===role.text&&r.sport===role.sport)) p.roles.push(role);
    return p;
  };
  D.tt.forEach(r=>{
    const ev = TT_EVENTS[r.event], dbl = r.event.endsWith("D");
    [r.a,r.b].forEach(n=>add(n,{sport:"tt",text:`Table Tennis · ${ev}${dbl?" (team)":""}`}));
    add(r.ref,{sport:"tt",text:"Table Tennis · Referee"});
  });
  D.carromTeams.forEach(t=>add(t.name,{sport:"carrom",text:`Carrom · Team ${pad(t.no)}`}));
  Object.entries(D.chessGroups).forEach(([g,ps])=>ps.forEach(n=>add(n,{sport:"chess",text:`Chess · Group ${g}`})));
  D.cricket.forEach(t=>{ add(t.name,{sport:"cricket",text:"Cricket · Team"}); t.players.forEach(n=>add(n,{sport:"cricket",text:`Cricket · ${t.name}`})); });
  D.volleyball.forEach(t=>{ add(t.name,{sport:"volleyball",text:"Volleyball · Team"}); t.players.forEach(([n,r])=>add(n,{sport:"volleyball",text:`Volleyball · ${t.name}${r?" · "+r:""}`})); });
  MATCHES.forEach(m=>{
    [m.a,m.b].forEach(n=>{ if(n && !isTBD(n) && P.has(norm(n))) P.get(norm(n)).matches.push(m); });
    if(m.ref && P.has(norm(m.ref))) P.get(norm(m.ref)).matches.push({...m, asRef:true});
  });
  // team members inherit their cricket / volleyball team's matches
  [["cricket",D.cricket,t=>t.players],["volleyball",D.volleyball,t=>t.players.map(x=>x[0])]].forEach(([k,teams,get])=>teams.forEach(t=>{
    const tm = MATCHES.filter(m=>m.sport===k && (norm(m.a)===norm(t.name)||norm(m.b)===norm(t.name)));
    if(tm.length) get(t).forEach(n=>{ const p=P.get(norm(n)); if(p) tm.forEach(m=>{ if(!p.matches.includes(m)) p.matches.push(m); }); });
  }));
  return [...P.values()];
})(); }
function viewSearch(raw){
  const q = norm(raw);
  if(q.length<2) return `<div class="empty">Type at least 2 letters of a name or team.</div>`;
  const hits = PEOPLE.filter(p=>norm(p.name).includes(q)).sort((a,b)=>a.name.localeCompare(b.name));
  if(!hits.length) return `<div class="empty">No player or team matches “${esc(raw)}”.<br>Try part of the name, for example the first name only.</div>`;
  const cards = hits.slice(0,40).map(p=>{
    const roles = p.roles.map(r=>`<span class="role" style="--c:var(${sportBy(r.sport).c})">${esc(r.text)}</span>`).join("");
    const ms = p.matches.slice().sort(byTime);
    const rows = ms.length ? ms.map(m=>{
      const r = matchRow(m,q,{withDate:true,withSport:true});
      return m.asRef ? r.replace('<div class="vs">','<div class="vs"><i>Referee:</i> ') : r;
    }).join("") : `<div class="m"><div class="t">—</div><div class="vs"><span class="tbd">${p.roles.some(r=>r.sport==="cricket"||r.sport==="volleyball")?"Cricket and volleyball fixtures coming soon":"No fixed match yet"}</span></div></div>`;
    return `<article class="person"><h4>${hl(p.name,q)}</h4><div class="roles">${roles}</div>${rows}</article>`;
  }).join("");
  return `<div class="sec-h"><h3>Search results</h3><span>${hits.length} ${hits.length===1?"match":"matches"} for “${esc(raw)}”</span></div><div class="res">${cards}</div>`;
}

/* ---------- Router ---------- */
const VIEWS = {"":viewAll,"table-tennis":viewTT,carrom:viewCarrom,chess:viewChess,cricket:viewCricket,volleyball:viewVolley};
function current(){ const h = location.hash.replace("#",""); return h in VIEWS ? h : ""; }
function render(){
  if(!D) return;
  const id = current(), q = $("#q").value.trim();
  const sp = sportBy(id);
  document.documentElement.style.setProperty("--accent", `var(${sp?sp.c:"--all"})`);
  $("#tabs").innerHTML = [{id:"",name:"All sports",c:"--all"},...SPORTS].map(s=>`<a class="tab" href="#${s.id}" style="--c:var(${s.c})" ${s.id===id?'aria-current="page"':""}>${s.name}</a>`).join("");
  $("#clear").hidden = !q;
  $("#app").innerHTML = q ? viewSearch(q) : VIEWS[id]();
}
window.addEventListener("hashchange",()=>{ $("#q").value=""; render(); window.scrollTo(0,0); });
$("#q").addEventListener("input",render);
$("#clear").addEventListener("click",()=>{ $("#q").value=""; render(); $("#q").focus(); });
document.addEventListener("click",e=>{
  const c = e.target.closest("[data-f]");
  if(c){ filter[c.dataset.f]=c.dataset.v; render(); return; }
  const b = e.target.closest("[data-copy]");
  if(b){
    const t = b.dataset.copy;
    const done = ()=>{ b.textContent="Copied"; setTimeout(()=>b.textContent="Copy link",1500); };
    const fail = ()=>{ b.textContent="Copy failed, use the link above"; };
    try{ navigator.clipboard.writeText(t).then(done,fail); }catch(_){ fail(); }
  }
  const a = e.target.closest('a.tab, a.card, .brand a');
  if(a && $("#q").value){ $("#q").value=""; setTimeout(render,0); }
});
async function boot(){
  try{
    const r = await fetch("data.json?v="+Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    D = await r.json();
  }catch(e){
    $("#app").innerHTML = `<div class="empty">Could not load the fixtures. Check your connection and refresh the page.</div>`;
    return;
  }
  buildMatches(); buildPeople(); render();
  if(D.updated) $("#updated").textContent = "Last updated " + new Date(D.updated).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}) + " · ";
}
$("#app").innerHTML = `<div class="empty">Loading fixtures…</div>`;
boot();
</script>
